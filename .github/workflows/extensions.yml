# Builds the extension toolkits (TKAlgoExt, GeomAlgoExt, BRepAlgoExt) and runs their GTests.
# A lean build: Foundation, Modeling data and Modeling algorithms only, static Release, as in CMakePresets.json.
# The upstream workflows in this directory (build-and-test-multiplatform.yml, master-validation.yml,
# daily-ir-vcpkg-configure.yml) build and test all of OCCT on Windows, macOS and Linux; they run by hand only.

name: Extensions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  GTEST_FILTER: 'BRep*Ext*:GeomAlgoExt*:CSLib_Class2d*:BRepTopAdaptor*:BndLib*:gp_Dir*:BRepTools*'

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      - name: Configure
        run: >
          cmake --preset native
          -DBUILD_MODULE_DataExchange=FALSE
          -DBUILD_MODULE_ApplicationFramework=FALSE
          -DBUILD_GTEST=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/native --target OpenCascadeGTest --parallel

      - name: Test
        run: |
          gtest="$(find build/native -name OpenCascadeGTest -type f)"
          "$gtest" --gtest_filter="$GTEST_FILTER"
